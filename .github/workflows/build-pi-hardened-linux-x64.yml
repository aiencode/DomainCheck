name: Build hardened Pi Linux x64

on:
  push:
    branches:
      - build/pi-1.1.0-hardened-linux-x64
    paths:
      - "pi-hardening/**"
      - ".github/workflows/build-pi-hardened-linux-x64.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-pi-1.1.0-hardened-linux-x64
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PI_VERSION: "1.1.0"
      PI_SOURCE_SHA256: "63b17b48b855e36e64c5013523acd48131ffcfa90ae48fe2f3e6fa9fe3d0da32"
      PI_PATCH_SHA256: "936fc7ee2a277cfc74997d373e0556bb8e9c08bcd81572b48c922fe9a8e79455"

    steps:
      - name: Checkout build recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Verify Linux x86_64 runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          node --version
          npm --version
          bun --version

      - name: Download, verify and patch Pi source
        shell: bash
        run: |
          set -euo pipefail
          build_root="${RUNNER_TEMP}/pi-${PI_VERSION}-hardened"
          rm -rf "${build_root}"
          mkdir -p "${build_root}"
          cd "${build_root}"

          source_archive="pi-${PI_VERSION}-source.tar.gz"
          curl -fL --retry 3 --retry-delay 2 \
            -o "${source_archive}" \
            "https://github.com/earendil-works/pi/releases/download/v${PI_VERSION}/${source_archive}"
          echo "${PI_SOURCE_SHA256}  ${source_archive}" | sha256sum -c -
          tar -xzf "${source_archive}"

          source_dir="${build_root}/pi-${PI_VERSION}"
          cd "${source_dir}"
          git init -q
          git config user.name "Pi Hardening Builder"
          git config user.email "pi-hardening@invalid.local"
          git add -A
          git commit -qm "baseline Pi v${PI_VERSION}"

          patch_file="${build_root}/pi-${PI_VERSION}-hardening.patch"
          cat "${GITHUB_WORKSPACE}"/pi-hardening/clean-patches/*.patch > "${patch_file}"
          echo "${PI_PATCH_SHA256}  ${patch_file}" | sha256sum -c -
          git apply --check "${patch_file}"
          git apply "${patch_file}"
          git diff --check

          regenerated_patch="${build_root}/pi-${PI_VERSION}-hardening-regenerated.patch"
          git diff > "${regenerated_patch}"
          echo "${PI_PATCH_SHA256}  ${regenerated_patch}" | sha256sum -c -

          echo "PI_SOURCE_DIR=${source_dir}" >> "${GITHUB_ENV}"
          echo "PI_PATCH_FILE=${patch_file}" >> "${GITHUB_ENV}"
          echo "PI_BUILD_ROOT=${build_root}" >> "${GITHUB_ENV}"

      - name: Install dependencies without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          cd "${PI_SOURCE_DIR}"
          npm ci --ignore-scripts

      - name: Run targeted hardening tests
        shell: bash
        run: |
          set -euo pipefail
          cd "${PI_SOURCE_DIR}"
          npm test --workspace=@earendil-works/pi-coding-agent -- \
            test/remote-catalog-provider.test.ts \
            test/session-share.test.ts \
            test/bug-report.test.ts \
            test/first-time-setup.test.ts \
            test/version-check.test.ts \
            test/package-command-paths.test.ts

      - name: Build all packages from bundled model data
        shell: bash
        run: |
          set -euo pipefail
          cd "${PI_SOURCE_DIR}"
          npm run build:offline

      - name: Build Linux x64 standalone binary
        shell: bash
        run: |
          set -euo pipefail
          cd "${PI_SOURCE_DIR}"
          ./scripts/build-binaries.sh \
            --skip-install \
            --skip-build \
            --offline-model-data \
            --platform linux-x64 \
            --out "${GITHUB_WORKSPACE}/pi-hardening/out"

      - name: Smoke-test Linux x64 binary
        shell: bash
        run: |
          set -euo pipefail
          binary="${GITHUB_WORKSPACE}/pi-hardening/out/linux-x64/pi"
          test -x "${binary}"
          file "${binary}"
          "${binary}" --version | tee "${PI_BUILD_ROOT}/version.txt"
          grep -Fx "${PI_VERSION}" "${PI_BUILD_ROOT}/version.txt"
          "${binary}" --help > "${PI_BUILD_ROOT}/help.txt"
          node "${PI_SOURCE_DIR}/scripts/smoke-test-codemode-binary.mjs" "${binary}"

      - name: Prepare downloadable files
        shell: bash
        run: |
          set -euo pipefail
          deliverables="${GITHUB_WORKSPACE}/pi-hardening/deliverables"
          rm -rf "${deliverables}"
          mkdir -p "${deliverables}"

          cp "${GITHUB_WORKSPACE}/pi-hardening/out/pi-linux-x64.tar.gz" \
            "${deliverables}/pi-${PI_VERSION}-hardened-linux-x64.tar.gz"
          cp "${PI_PATCH_FILE}" "${deliverables}/pi-${PI_VERSION}-hardening.patch"
          cp "${GITHUB_WORKSPACE}/pi-hardening/HARDENING.md" "${deliverables}/HARDENING.md"

          cat > "${deliverables}/BUILD-RESULT.txt" <<EOF
          Pi version: ${PI_VERSION}
          Target: Linux x86_64
          Source SHA-256: ${PI_SOURCE_SHA256}
          Patch SHA-256: ${PI_PATCH_SHA256}
          Targeted hardening tests: passed
          Offline full build: passed
          Linux x64 binary build: passed
          Version/help/codemode smoke tests: passed
          EOF

          cd "${deliverables}"
          sha256sum \
            "pi-${PI_VERSION}-hardened-linux-x64.tar.gz" \
            "pi-${PI_VERSION}-hardening.patch" \
            HARDENING.md \
            BUILD-RESULT.txt > SHA256SUMS
          cat SHA256SUMS

      - name: Upload hardened Linux x64 package
        uses: actions/upload-artifact@ea165f8d65b5e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pi-1.1.0-hardened-linux-x64
          path: pi-hardening/deliverables/*
          if-no-files-found: error
          retention-days: 30
